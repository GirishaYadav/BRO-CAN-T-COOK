<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Maggie Simulator — Bro Can't Cook</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at 10% 15%,
            rgba(186,168,255,.55), transparent 40%),

        radial-gradient(circle at 88% 10%,
            rgba(150,200,255,.55), transparent 45%),

        radial-gradient(circle at 92% 78%,
            rgba(255,180,210,.50), transparent 45%),

        radial-gradient(circle at 8% 88%,
            rgba(255,230,150,.60), transparent 45%),

        linear-gradient(
            135deg,
            #e7defc,
            #ffe3f0,
            #fff6da
        );

    background-size: 200% 200%;
    animation: universeBackground 18s ease infinite;

    position: relative;
}

@keyframes universeBackground {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


/* =========================================================
   SVG / FLOATING FOOD
========================================================= */

.floating-food {
    position: fixed;
    pointer-events: none;
    z-index: 0;

    animation:
        floatAround 6s ease-in-out infinite,
        tinyJiggle 3s ease-in-out infinite;
}

.floating-food svg {
    display: block;
    filter:
        drop-shadow(
            2px 5px 6px
            rgba(120,80,30,.20)
        );
}

.noodle {
    width: 90px;
    height: 165px;
}

.noodle.small {
    width: 65px;
    height: 120px;
}

.noodle.large {
    width: 105px;
    height: 190px;
}

.chili {
    width: 48px;
    height: 34px;
}

.scallion {
    width: 27px;
    height: 27px;
}

.seasoning {
    width: 14px;
    height: 14px;

    border-radius: 3px;

    background:
        linear-gradient(
            135deg,
            #ffb62c,
            #ed8714
        );

    box-shadow:
        2px 3px 4px
        rgba(120,70,10,.2);
}


/* positions */

.food-1 {
    top: 3%;
    left: 8%;
    animation-delay: 0s;
}

.food-2 {
    top: 14%;
    left: 16%;
    animation-delay: 1.3s;
}

.food-3 {
    top: 8%;
    right: 15%;
    animation-delay: .7s;
}

.food-4 {
    top: 25%;
    right: 6%;
    animation-delay: 2s;
}

.food-5 {
    top: 32%;
    left: 8%;
    animation-delay: 1.7s;
}

.food-6 {
    top: 38%;
    right: 15%;
    animation-delay: 2.5s;
}

.food-7 {
    bottom: 20%;
    left: 7%;
    animation-delay: .5s;
}

.food-8 {
    bottom: 30%;
    right: 8%;
    animation-delay: 1.8s;
}

.food-9 {
    bottom: 9%;
    left: 23%;
    animation-delay: 1s;
}

.food-10 {
    bottom: 18%;
    right: 27%;
    animation-delay: 2.3s;
}

.food-11 {
    top: 53%;
    left: 23%;
    animation-delay: 2.8s;
}

.food-12 {
    top: 62%;
    right: 19%;
    animation-delay: 1.5s;
}

.food-13 {
    bottom: 7%;
    right: 8%;
    animation-delay: 3s;
}


@keyframes floatAround {
    0% {
        translate: 0 0;
    }

    50% {
        translate: 0 -12px;
    }

    100% {
        translate: 0 0;
    }
}

@keyframes tinyJiggle {
    0% {
        rotate: -3deg;
    }

    25% {
        rotate: 3deg;
    }

    50% {
        rotate: -2deg;
    }

    75% {
        rotate: 3deg;
    }

    100% {
        rotate: -3deg;
    }
}


/* =========================================================
   SCREEN SYSTEM
========================================================= */

.screen {
    display: none;

    min-height: 100vh;
    width: 100%;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    position: relative;

    z-index: 10;

    padding: 20px;

    text-align: center;
}

.screen.active {
    display: flex;
}


/* =========================================================
   LANDING PAGE
========================================================= */

.title {
    font-size: clamp(42px, 7vw, 80px);

    font-weight: 800;

    letter-spacing: -3px;

    color: #292929;

    text-shadow:
        0 5px 12px
        rgba(0,0,0,.08);
}

.subtitle {
    margin-top: 12px;

    font-size: 18px;

    color: #666;

    letter-spacing: .4px;
}

.start-button {
    margin-top: 32px;

    padding: 17px 38px;

    border: none;

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            #ffc02e,
            #f5ad20
        );

    color: white;

    font-size: 18px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 10px 25px
        rgba(240,170,30,.30);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.start-button:hover {
    transform:
        translateY(-4px)
        scale(1.03);

    box-shadow:
        0 15px 30px
        rgba(240,170,30,.38);
}

.start-button:active {
    transform: scale(.96);
}


/* =========================================================
   KITCHEN HUD
========================================================= */

.hud {
    max-width: 520px;
    width: 100%;

    margin-bottom: 10px;
}

.step-label {
    font-size: 12px;

    font-weight: 800;

    letter-spacing: 1px;

    color: #b95a30;
}

.progress-track {
    width: 100%;

    height: 8px;

    background:
        rgba(255,255,255,.60);

    border-radius: 10px;

    margin: 8px 0 16px;

    overflow: hidden;
}

.progress-fill {
    height: 100%;

    width: 0%;

    background: #e85c7a;

    transition:
        width .5s ease;
}

.instruction {
    font-size: 23px;

    font-weight: 800;

    color: #292929;
}

.description {
    margin-top: 4px;

    font-size: 15px;

    color: #6a5a4a;

    min-height: 20px;
}


/* =========================================================
   COOKING AREA
========================================================= */

.cook-area {
    position: relative;

    width: 640px;

    max-width: 94vw;

    height: 420px;

    margin-top: 10px;
}


/* =========================================================
   BOWL
========================================================= */

.bowl-zone {
    position: absolute;

    left: 50%;
    top: 44%;

    transform:
        translate(-50%,-50%);

    width: 280px;
    height: 200px;
}

.bowl {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 150px;

    background:
        linear-gradient(
            180deg,
            #fffdf5,
            #eadac4
        );

    border-radius:
        20px 20px 45% 45%;

    box-shadow:
        0 14px 28px
        rgba(80,50,30,.20);

    overflow: hidden;
}

.bowl::after {
    content: "";

    position: absolute;

    left: 0;

    top: 45px;

    width: 100%;

    height: 9px;

    background: #e34a35;

    z-index: 5;
}

.bowl-rim {
    position: absolute;

    top: -5px;
    left: -5px;

    width: calc(100% + 10px);

    height: 65px;

    background:
        radial-gradient(
            ellipse,
            #f8e8cf 0%,
            #fffaf0 65%
        );

    border-radius: 50%;

    box-shadow:
        inset 0 -8px 12px
        rgba(100,70,30,.12);

    z-index: 5;
}

.water-fill {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 0;

    background:
        linear-gradient(
            180deg,
            rgba(140,210,240,.55),
            rgba(120,190,225,.75)
        );

    transition:
        height 1.1s ease;

    z-index: 1;
}

.noodles-in-bowl {
    position: absolute;
    left: 14%;
    top: 22%;
    width: 72%;
    height: 46%;
    opacity: 0;
    transform: scale(.75);
    transition:
        opacity .5s ease,
        transform .5s ease;
    z-index: 2;
}

.noodles-in-bowl.show {
    opacity: 1;
    transform: scale(1);
}

/* the wavy curly noodle mound (SVG), used in-bowl and in the
   draggable chunk for a consistent, non-stick-like look */
.noodle-nest-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    filter:
        drop-shadow(2px 5px 5px rgba(150, 90, 10, 0.25));
}

/* veggie bits tossed in with the noodles */
.noodles-in-bowl .veggie {
    position: absolute;
    box-shadow: 0 2px 3px rgba(80, 50, 10, 0.25);
    z-index: 3;
}

.noodles-in-bowl .pea {
    width: 9%;
    height: 12%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #b6e88a, #6fa832 75%);
}

.noodles-in-bowl .p1 { left: 10%; top: 12%; }
.noodles-in-bowl .p2 { left: 72%; top: 40%; }
.noodles-in-bowl .p3 { left: 42%; top: 66%; }

.noodles-in-bowl .carrot {
    width: 10%;
    height: 14%;
    border-radius: 3px;
    background: linear-gradient(135deg, #ffb15e, #f07f1a);
    transform: rotate(45deg);
}

.noodles-in-bowl .c1 { left: 30%; top: 8%; }
.noodles-in-bowl .c2 { left: 60%; top: 18%; }

.masala-in-bowl {
    position: absolute;

    inset: 20% 12%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            #e0793a,
            #b8461f
        );

    opacity: 0;

    transition:
        opacity .6s ease;

    z-index: 3;

    mix-blend-mode: multiply;
}

.masala-in-bowl.show {
    opacity: .6;
}


/* =========================================================
   STEAM
========================================================= */

.steam {
    position: absolute;

    left: 50%;
    bottom: 118px;

    width: 190px;
    height: 125px;

    transform: translateX(-50%);

    z-index: 30;

    pointer-events: none;

    opacity: 0;

    overflow: visible;
}

.steam-wisp {
    position: absolute;

    bottom: 0;

    width: 15px;
    height: 85px;

    border-left:
        8px solid
        rgba(245,250,255,.95);

    border-radius: 50%;

    filter: blur(1px);

    opacity: 0;

    transform-origin: bottom center;

    box-shadow:
        0 0 10px
        rgba(225,245,255,.75);
}

.steam-1 {
    left: 18px;

    animation:
        steamRise1
        2s ease-out infinite;
}

.steam-2 {
    left: 52px;

    height: 105px;

    animation:
        steamRise2
        2.4s ease-out infinite .35s;
}

.steam-3 {
    left: 88px;

    height: 92px;

    animation:
        steamRise3
        2.1s ease-out infinite .7s;
}

.steam-4 {
    left: 122px;

    height: 108px;

    animation:
        steamRise4
        2.5s ease-out infinite .15s;
}

.steam-5 {
    left: 155px;

    height: 82px;

    animation:
        steamRise5
        2.2s ease-out infinite .9s;
}


@keyframes steamRise1 {

    0% {
        opacity: 0;

        transform:
            translate(0, 8px)
            scale(.65)
            rotate(-8deg);
    }

    15% {
        opacity: .95;
    }

    35% {
        transform:
            translate(-13px, -18px)
            scale(.8)
            rotate(11deg);
    }

    55% {
        transform:
            translate(10px, -45px)
            scale(1)
            rotate(-9deg);
    }

    75% {
        opacity: .55;

        transform:
            translate(-11px, -75px)
            scale(1.15)
            rotate(9deg);
    }

    100% {
        opacity: 0;

        transform:
            translate(7px, -118px)
            scale(1.4)
            rotate(-6deg);
    }
}


@keyframes steamRise2 {

    0% {
        opacity: 0;

        transform:
            translate(0, 8px)
            scale(.6)
            rotate(7deg);
    }

    15% {
        opacity: .95;
    }

    35% {
        transform:
            translate(12px, -20px)
            scale(.8)
            rotate(-10deg);
    }

    55% {
        transform:
            translate(-10px, -50px)
            scale(1)
            rotate(9deg);
    }

    75% {
        opacity: .55;

        transform:
            translate(12px, -82px)
            scale(1.15)
            rotate(-8deg);
    }

    100% {
        opacity: 0;

        transform:
            translate(-7px, -125px)
            scale(1.4)
            rotate(6deg);
    }
}


@keyframes steamRise3 {

    0% {
        opacity: 0;

        transform:
            translate(0, 8px)
            scale(.65)
            rotate(-5deg);
    }

    15% {
        opacity: .95;
    }

    40% {
        transform:
            translate(-10px, -20px)
            scale(.82)
            rotate(9deg);
    }

    60% {
        transform:
            translate(11px, -53px)
            scale(1)
            rotate(-8deg);
    }

    80% {
        opacity: .5;

        transform:
            translate(-9px, -85px)
            scale(1.2)
            rotate(8deg);
    }

    100% {
        opacity: 0;

        transform:
            translate(8px, -120px)
            scale(1.4)
            rotate(-6deg);
    }
}


@keyframes steamRise4 {

    0% {
        opacity: 0;

        transform:
            translate(0, 8px)
            scale(.6)
            rotate(7deg);
    }

    15% {
        opacity: .95;
    }

    40% {
        transform:
            translate(13px, -20px)
            scale(.8)
            rotate(-9deg);
    }

    60% {
        transform:
            translate(-11px, -50px)
            scale(1)
            rotate(8deg);
    }

    80% {
        opacity: .5;

        transform:
            translate(9px, -82px)
            scale(1.2)
            rotate(-8deg);
    }

    100% {
        opacity: 0;

        transform:
            translate(-8px, -120px)
            scale(1.4)
            rotate(6deg);
    }
}


@keyframes steamRise5 {

    0% {
        opacity: 0;

        transform:
            translate(0, 8px)
            scale(.6)
            rotate(-6deg);
    }

    15% {
        opacity: .95;
    }

    40% {
        transform:
            translate(-11px, -18px)
            scale(.8)
            rotate(9deg);
    }

    60% {
        transform:
            translate(10px, -48px)
            scale(1)
            rotate(-8deg);
    }

    80% {
        opacity: .5;

        transform:
            translate(-9px, -78px)
            scale(1.2)
            rotate(7deg);
    }

    100% {
        opacity: 0;

        transform:
            translate(6px, -112px)
            scale(1.4)
            rotate(-5deg);
    }
}


.cook-area.boiling .steam {
    opacity: 1;
}


/* =========================================================
   BUBBLES
========================================================= */

.bubble {
    position: absolute;

    bottom: 20px;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.7);

    z-index: 4;

    pointer-events: none;

    animation:
        bubbleUp
        .9s ease-out forwards;
}

@keyframes bubbleUp {
    0% {
        transform:
            translateY(0)
            scale(.6);

        opacity: .9;
    }

    100% {
        transform:
            translateY(-70px)
            scale(1.1);

        opacity: 0;
    }
}


/* =========================================================
   PACKET
========================================================= */

.packet {
    position: absolute;

    left: 10px;
    bottom: 0;

    width: 125px;
    height: 165px;

    background:
        linear-gradient(
            135deg,
            #ffd928,
            #ffb900
        );

    border:
        3px solid #e6a900;

    border-radius: 10px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    transition:
        transform .5s ease,
        opacity .5s ease;

    z-index: 7;

    box-shadow:
        0 8px 16px
        rgba(120,80,10,.20);
}

.packet::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 15px;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 7px,
            rgba(170,110,0,.25) 8px,
            rgba(170,110,0,.25) 10px
        );
}

.packet-logo {
    background: #ed1d24;

    color: #ffd52b;

    font-weight: 900;

    font-style: italic;

    font-size: 17px;

    padding: 6px 12px;

    border-radius: 50%;

    transform: rotate(-3deg);
}

.packet-food {
    font-size: 40px;

    margin-top: 12px;
}

.packet.torn {
    transform:
        rotate(-25deg)
        scale(.85);

    opacity: .4;
}

.tap-hint {
    position: absolute;

    bottom: -22px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 11px;

    color: #8a6a4a;

    white-space: nowrap;
}


/* =========================================================
   NOODLE CHUNK
========================================================= */

.noodle-chunk {
    position: absolute;

    left: 14px;
    bottom: 172px;

    width: 100px;
    height: 44px;

    cursor: grab;

    z-index: 8;

    touch-action: none;
}

.noodle-chunk.dragging {
    cursor: grabbing;

    z-index: 50;
}


/* =========================================================
   WATER JUG
========================================================= */

.water-jug {
    position: absolute;

    right: 10px;
    top: 0;

    width: 64px;
    height: 92px;

    background:
        linear-gradient(
            180deg,
            #bfe8ff,
            #8fd0f2
        );

    border:
        3px solid #6fb8dd;

    border-radius:
        12px 12px 20px 20px;

    cursor: grab;

    z-index: 8;

    touch-action: none;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 24px;

    box-shadow:
        0 6px 12px
        rgba(70,130,170,.25);
}

.water-jug.dragging {
    cursor: grabbing;

    z-index: 50;
}



/* =========================================================
   MERGED FEATURE: INTERACTIVE GLASS WATER JUG
========================================================= */

.water-glass {
    position: absolute;
    right: 10px;
    top: 0;
    width: 46px;
    height: 78px;
    background: rgba(255,255,255,.18);
    border: 3px solid rgba(140,190,220,.85);
    border-radius: 6px 6px 14px 14px;
    cursor: grab;
    z-index: 8;
    touch-action: none;
    overflow: hidden;
    box-shadow: 0 6px 12px rgba(70,130,170,.25), inset 0 0 10px rgba(255,255,255,.4);
    transition: transform .18s ease;
}

.glass-water {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 70%;
    background: linear-gradient(180deg, #bfe8ff, #6fc0ea);
    transition: height .2s ease;
}

.glass-shine {
    position: absolute;
    left: 6px;
    top: 4px;
    width: 6px;
    height: 90%;
    background: rgba(255,255,255,.55);
    border-radius: 3px;
}

.water-glass.dragging {
    cursor: grabbing;
    z-index: 50;
}

.water-glass.tilt {
    transform: rotate(50deg);
}

/* =========================================================
   MASALA PACKET
========================================================= */

.masala-packet {
    position: absolute;

    right: 10px;
    top: 0;

    width: 65px;
    height: 85px;

    background:
        linear-gradient(
            135deg,
            #e0793a,
            #b8461f
        );

    border:
        3px solid #8c3211;

    border-radius: 8px;

    cursor: grab;

    z-index: 8;

    touch-action: none;

    color: white;

    font-size: 10px;

    font-weight: 800;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    box-shadow:
        0 6px 12px
        rgba(120,60,10,.25);
}

.masala-packet.dragging {
    cursor: grabbing;

    z-index: 50;
}


/* =========================================================
   SPOON
========================================================= */

.spoon {
    position: absolute;

    left: 50%;
    top: 44%;

    width: 60px;
    height: 60px;

    margin:
        -30px 0 0 -30px;

    font-size: 44px;

    z-index: 9;

    cursor: grab;

    touch-action: none;

    user-select: none;

    filter:
        drop-shadow(
            0 5px 6px
            rgba(80,60,30,.25)
        );

    display: flex;

    align-items: center;

    justify-content: center;
}

.spoon:active {
    cursor: grabbing;
}


/* =========================================================
   STIR METER
========================================================= */

.stir-meter {
    position: absolute;

    left: 50%;

    bottom: -18px;

    transform:
        translateX(-50%);

    width: 210px;

    height: 10px;

    background:
        rgba(255,255,255,.55);

    border-radius: 10px;

    overflow: hidden;

    z-index: 9;
}

.stir-fill {
    height: 100%;

    width: 0%;

    background: #e85c7a;
}


/* =========================================================
   TIMER
========================================================= */

.timer-display {
    position: absolute;

    left: 50%;
    top: 6%;

    transform:
        translateX(-50%);

    font-weight: 800;

    font-size: 20px;

    background:
        rgba(255,255,255,.75);

    padding: 4px 16px;

    border-radius: 20px;

    z-index: 9;
}

.hidden-el {
    display: none !important;
}


/* =========================================================
   MASALA PARTICLES
========================================================= */

.masala-particle {
    position: absolute;

    top: -20px;

    width: 6px;
    height: 6px;

    border-radius: 2px;

    background: #c2410c;

    z-index: 6;

    pointer-events: none;

    animation:
        particleFall
        1s ease-in forwards;
}

@keyframes particleFall {
    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;
    }

    100% {
        transform:
            translateY(160px)
            rotate(180deg);

        opacity: 0;
    }
}


/* =========================================================

<script>
/* =========================================================
   ELEMENT REFERENCES
========================================================= */

const landing =
    document.getElementById("landing");

const kitchen =
    document.getElementById("kitchen");

const finished =
    document.getElementById("finished");


const stepLabel =
    document.getElementById("stepLabel");

const progressFill =
    document.getElementById("progressFill");

const instruction =
    document.getElementById("instruction");

const description =
    document.getElementById("description");


const cookArea =
    document.getElementById("cookArea");

const bowlZone =
    document.getElementById("bowlZone");

const waterFill =
    document.getElementById("waterFill");

const noodlesInBowl =
    document.getElementById("noodlesInBowl");

const masalaInBowl =
    document.getElementById("masalaInBowl");

const packet =
    document.getElementById("packet");

const noodleChunk =
    document.getElementById("noodleChunk");

const waterJug =
    document.getElementById("waterJug");

const glassWater =
    document.getElementById("glassWater");

const masalaPacket =
    document.getElementById("masalaPacket");

const spoon =
    document.getElementById("spoon");

const stirMeter =
    document.getElementById("stirMeter");

const stirFill =
    document.getElementById("stirFill");

const timerDisplay =
    document.getElementById("timerDisplay");


const eatBtn =
    document.getElementById("eatBtn");

const againBtn =
    document.getElementById("againBtn");

const finishTitle =
    document.getElementById("finishTitle");

const finishDesc =
    document.getElementById("finishDesc");


/* =========================================================
   SET STEP
========================================================= */

function setStep(
    label,
    instr,
    desc,
    pct
) {

    stepLabel.textContent = label;

    instruction.textContent = instr;

    description.textContent = desc;

    progressFill.style.width =
        pct + "%";
}


/* =========================================================
   START GAME
========================================================= */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        function () {

            landing.classList.remove("active");

            kitchen.classList.add("active");

            beginStep1();

        }
    );


/* =========================================================
   STEP 1
   OPEN PACKET
========================================================= */

function beginStep1() {

    setStep(
        "STEP 1 OF 6",
        "Open the packet",
        "Tap the Maggie packet to tear it open.",
        0
    );

    packet.onclick =
        tearPacket;
}


function tearPacket() {

    packet.onclick = null;

    packet.classList.add("torn");

    setTimeout(
        function () {

            revealNoodleChunk();

            beginStep2();

        },
        450
    );
}


/* =========================================================
   DRAG HELPERS
========================================================= */

function captureHome(el) {

    el._home =
        el.getBoundingClientRect();
}


function isOverBowl(el) {

    const r =
        el.getBoundingClientRect();

    const cx =
        r.left + r.width / 2;

    const cy =
        r.top + r.height / 2;

    const b =
        bowlZone.getBoundingClientRect();

    return (
        cx > b.left &&
        cx < b.right &&
        cy > b.top &&
        cy < b.bottom
    );
}


function resetPosition(el) {

    if (!el._home)
        return;

    el.style.transition =
        "left .35s ease, top .35s ease";

    el.style.left =
        el._home.left + "px";

    el.style.top =
        el._home.top + "px";

    setTimeout(
        function () {

            el.style.position = "";

            el.style.left = "";

            el.style.top = "";

            el.style.margin = "";

            el.style.transition = "";

        },
        360
    );
}


function enableDrag(
    el,
    onDrop,
    onMove
) {

    let dragging = false;

    let startX = 0;
    let startY = 0;

    let origLeft = 0;
    let origTop = 0;


    el.style.touchAction =
        "none";


    el.onpointerdown =
        function (e) {

            dragging = true;

            el.setPointerCapture(
                e.pointerId
            );

            el.classList.add(
                "dragging"
            );

            const rect =
                el.getBoundingClientRect();

            startX =
                e.clientX;

            startY =
                e.clientY;

            origLeft =
                rect.left;

            origTop =
                rect.top;
        };


    el.onpointermove =
        function (e) {

            if (!dragging)
                return;

            const dx =
                e.clientX - startX;

            const dy =
                e.clientY - startY;


            el.style.position =
                "fixed";

            el.style.margin =
                "0";

            el.style.left =
                (origLeft + dx) + "px";

            el.style.top =
                (origTop + dy) + "px";

            if (onMove) {
                onMove(isOverBowl(el));
            }
        };


    el.onpointerup =
        function () {

            if (!dragging)
                return;

            dragging = false;

            el.classList.remove(
                "dragging"
            );

            const dropped =
                isOverBowl(el);

            onDrop(dropped);
        };


    el.onpointercancel =
        function () {

            dragging = false;

            el.classList.remove(
                "dragging"
            );
        };
}


/* =========================================================
   STEP 2
   ADD NOODLES
========================================================= */

function beginStep2() {

    setStep(
        "STEP 2 OF 6",
        "Add the noodles",
        "Drag the noodles into the bowl.",
        14
    );
}


function revealNoodleChunk() {

    noodleChunk.classList.remove(
        "hidden-el"
    );

    requestAnimationFrame(
        function () {

            captureHome(
                noodleChunk
            );

        }
    );

    enableDrag(
        noodleChunk,
        function (dropped) {

            if (dropped) {

                noodleChunk.classList.add(
                    "hidden-el"
                );

                noodlesInBowl.classList.add(
                    "show"
                );

                beginStep3();

            } else {

                resetPosition(
                    noodleChunk
                );

            }

        }
    );
}


/* =========================================================
   STEP 3
   ADD WATER
========================================================= */

function beginStep3() {

    setStep(
        "STEP 3 OF 6",
        "Add water",
        "Drag the water jug over the bowl to pour.",
        28
    );


    waterJug.classList.remove(
        "hidden-el"
    );


    requestAnimationFrame(
        function () {

            captureHome(
                waterJug
            );

        }
    );

    enableDrag(
        waterJug,
        function (dropped) {
            if (dropped) {
                pourWater();
            } else {
                waterJug.classList.remove("tilt");
                glassWater.style.height = "70%";
                resetPosition(waterJug);
            }
        },
        function (overBowl) {
            if (overBowl) {
                waterJug.classList.add("tilt");
                glassWater.style.height = "15%";
            } else {
                waterJug.classList.remove("tilt");
                glassWater.style.height = "70%";
            }
        }
    );
}


function pourWater() {
    waterJug.classList.remove("tilt");
    glassWater.style.height = "0%";

    setTimeout(function () {
        waterJug.classList.add("hidden-el");
        glassWater.style.height = "70%";
        waterFill.style.height = "55px";
    }, 300);

    setTimeout(beginStep4, 1200);
}


/* =========================================================
   STEP 4
   STIRRING
========================================================= */

let stirAmount = 0;

let lastAngle = null;

let stirring = false;

const STIR_TARGET = 18;


function beginStep4() {

    setStep(
        "STEP 4 OF 6",
        "Stir it up",
        "Drag the spoon in circles inside the bowl.",
        42
    );

    spoon.classList.remove("hidden-el");
    stirMeter.classList.remove("hidden-el");
    stirFill.style.width = "0%";

    stirAmount = 0;
    lastAngle = null;
    stirring = false;

    spoon.onpointerdown = function (e) {
        stirring = true;
        spoon.setPointerCapture(e.pointerId);
    };

    spoon.onpointermove = function (e) {

        if (!stirring) return;

        const b = bowlZone.getBoundingClientRect();
        const cx = b.left + b.width / 2;
        const cy = b.top + b.height / 2;

        const angle = Math.atan2(e.clientY - cy, e.clientX - cx);

        if (lastAngle !== null) {

            let delta = angle - lastAngle;

            while (delta > Math.PI)  delta -= 2 * Math.PI;
            while (delta < -Math.PI) delta += 2 * Math.PI;

            stirAmount += Math.abs(delta);

            /* z-axis stirring: flat orbit + depth scale + layering */
            const radiusX = 70;
            const radiusY = 16;
            const baseY   = -25;

            const x = Math.cos(angle) * radiusX;
            const z = Math.sin(angle);
            const y = baseY + z * radiusY;

            const scale = 1 + z * 0.25;
            const tilt  = Math.cos(angle) * 18;

            spoon.style.transform =
                `translate(${x}px, ${y}px) scale(${scale}) rotate(${tilt}deg)`;

            spoon.style.zIndex = z >= 0 ? 9 : -1;

            noodlesInBowl.style.transform =
                `scale(1) rotate(${angle * 25}deg)`;

            const pct = Math.min(100, (stirAmount / STIR_TARGET) * 100);
            stirFill.style.width = pct + "%";

            if (stirAmount >= STIR_TARGET) {
                finishStir();
            }
        }

        lastAngle = angle;
    };

    spoon.onpointerup = function () {
        stirring = false;
        lastAngle = null;
    };

    spoon.onpointercancel = function () {
        stirring = false;
        lastAngle = null;
    };
}


function finishStir() {

    spoon.onpointerdown = null;
    spoon.onpointermove = null;
    spoon.onpointerup = null;

    spoon.style.zIndex = "";

    spoon.classList.add("hidden-el");
    stirMeter.classList.add("hidden-el");

    beginStep5();
}

/* =========================================================
   STEP 5
   BOILING
========================================================= */

function beginStep5() {

    setStep(
        "STEP 5 OF 6",
        "Boiling...",
        "Please wait. Maggie is having a moment.",
        57
    );


    timerDisplay.classList.remove(
        "hidden-el"
    );

    cookArea.classList.add(
        "boiling"
    );


    let seconds = 15;


    timerDisplay.textContent =
        seconds + "s";


    const messages = [

        "Waiting for culinary greatness...",

        "Please remain patient. It's Maggie.",

        "Boiling intensifies...",

        "You could have made it by now.",

        "Still boiling...",

        "This is very serious business."

    ];


    let messageIndex = 0;


    const messageInterval =
        setInterval(
            function () {

                messageIndex =
                    (messageIndex + 1)
                    % messages.length;

                description.textContent =
                    messages[messageIndex];

            },
            2200
        );


    const bubbleInterval =
        setInterval(
            function () {

                const bubble =
                    document.createElement(
                        "span"
                    );

                bubble.className =
                    "bubble";

                bubble.style.left =
                    (30 +
                    Math.random() * 40)
                    + "%";


                bowlZone.appendChild(
                    bubble
                );


                setTimeout(
                    function () {

                        bubble.remove();

                    },
                    900
                );

            },
            350
        );


    const timer =
        setInterval(
            function () {

                seconds--;

                timerDisplay.textContent =
                    seconds + "s";


                if (seconds <= 0) {

                    clearInterval(
                        timer
                    );

                    clearInterval(
                        messageInterval
                    );

                    clearInterval(
                        bubbleInterval
                    );


                    cookArea.classList.remove(
                        "boiling"
                    );


                    timerDisplay.classList.add(
                        "hidden-el"
                    );


                    beginStep6();
                }

            },
            1000
        );
}


/* =========================================================
   STEP 6
   MASALA
========================================================= */

function beginStep6() {

    setStep(
        "STEP 6 OF 6",
        "Add masala",
        "Drag the masala packet over the bowl and pour.",
        80
    );


    masalaPacket.classList.remove(
        "hidden-el"
    );


    requestAnimationFrame(
        function () {

            captureHome(
                masalaPacket
            );

        }
    );


    enableDrag(
        masalaPacket,
        function (dropped) {

            if (dropped) {

                pourMasala();

            } else {

                resetPosition(
                    masalaPacket
                );

            }

        }
    );
}


/* =========================================================
   POUR MASALA
========================================================= */

function pourMasala() {

    masalaPacket.classList.add(
        "hidden-el"
    );


    for (
        let i = 0;
        i < 14;
        i++
    ) {

        const particle =
            document.createElement(
                "span"
            );

        particle.className =
            "masala-particle";


        particle.style.left =
            (35 +
            Math.random() * 50)
            + "%";


        particle.style.animationDelay =
            (Math.random() * .4)
            + "s";


        bowlZone.appendChild(
            particle
        );


        setTimeout(
            function () {

                particle.remove();

            },
            1300
        );
    }


    setTimeout(
        function () {

            masalaInBowl.classList.add(
                "show"
            );

            finishGame();

        },
        900
    );
}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame() {

    setStep(
        "STEP 6 OF 6",
        "",
        "",
        100
    );


    kitchen.classList.remove(
        "active"
    );


    finished.classList.add(
        "active"
    );
}


/* =========================================================
   EAT BUTTON
========================================================= */

eatBtn.onclick =
    function () {

        eatBtn.disabled =
            true;

        eatBtn.textContent =
            "Yum 🍜 (sort of)";

        finishDesc.textContent =
            "You ate the virtual Maggie. Was it worth it? Absolutely not.";
    };


/* =========================================================
   PLAY AGAIN
========================================================= */

againBtn.onclick =
    function () {

        finished.classList.remove(
            "active"
        );

        landing.classList.add(
            "active"
        );

        resetAll();
    };


/* =========================================================
   RESET GAME
========================================================= */

function resetAll() {

    packet.classList.remove(
        "torn"
    );

    packet.onclick = null;


    /* noodles */

    noodleChunk.classList.add(
        "hidden-el"
    );

    noodleChunk.style.position = "";

    noodleChunk.style.left = "";

    noodleChunk.style.top = "";

    noodleChunk.style.margin = "";


    noodlesInBowl.classList.remove(
        "show"
    );

    noodlesInBowl.style.transform =
        "";


    /* water */

    waterJug.classList.add(
        "hidden-el"
    );

    waterJug.style.position = "";

    waterJug.style.left = "";

    waterJug.style.top = "";

    waterJug.style.margin = "";

    glassWater.style.height = "70%";

    waterJug.classList.remove("tilt");


    waterFill.style.height =
        "0";


    /* spoon */

    spoon.classList.add(
        "hidden-el"
    );

    spoon.style.transform =
        "";
    spoon.style.zIndex = "";

    stirMeter.classList.add(
        "hidden-el"
    );

    stirFill.style.width =
        "0%";


    /* timer */

    timerDisplay.classList.add(
        "hidden-el"
    );


    /* masala */

    masalaPacket.classList.add(
        "hidden-el"
    );

    masalaPacket.style.position =
        "";

    masalaPacket.style.left =
        "";

    masalaPacket.style.top =
        "";

    masalaPacket.style.margin =
        "";


    masalaInBowl.classList.remove(
        "show"
    );


    /* reset finish */

    eatBtn.disabled =
        false;

    eatBtn.textContent =
        "EAT IT 🍜";

    finishTitle.textContent =
        "MAGGIE READY!";

    finishDesc.textContent =
        "Congratulations. You just made virtual Maggie.";
}


/* =========================================================
   DONE
========================================================= */
</script>
